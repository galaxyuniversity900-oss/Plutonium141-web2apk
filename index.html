function openDB(){return new Promise((resolve,reject)=>{let settled=false,blocked=false;const req=indexedDB.open(DB_NAME,DB_VERSION);const timer=setTimeout(()=>{if(settled)return;settled=true;reject(new Error(blocked?"تحديث قاعدة البيانات متوقف لأن نسخة أخرى من التطبيق ما زالت مفتوحة. أغلق النسخ الأخرى ثم أعد تحميل الصفحة. لم يتم حذف البيانات.":"انتهت مهلة فتح قاعدة البيانات. أعد تحميل الصفحة، ولا تمسح بيانات المتصفح."));},20000);const fail=err=>{if(settled)return;settled=true;clearTimeout(timer);reject(err instanceof Error?err:new Error("تعذر فتح قاعدة البيانات"));};req.onupgradeneeded=()=>{const d=req.result;stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"});});};req.onblocked=()=>{blocked=true;toast("قاعدة البيانات تنتظر إغلاق نسخة أخرى من عُمران. أغلق علامات التبويب أو النسخ الأخرى ثم انتظر؛ لن تُحذف بياناتك.","error");};req.onsuccess=()=>{const d=req.result;if(settled){d.close();return;}settled=true;clearTimeout(timer);d.onversionchange=()=>{d.close();toast("تم طلب تحديث قاعدة البيانات من نسخة أخرى. أعد تحميل هذه الصفحة بعد انتهاء التحديث.","error");};resolve(d);};req.onerror=()=>fail(req.error||new Error("تعذر فتح قاعدة البيانات"));});}
function all(store){return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readonly"),r=tx.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function get(store,id){return new Promise((resolve,reject)=>{const r=db.transaction(store,"readonly").objectStore(store).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});}
function put(store,obj){return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(obj);tx.oncomplete=()=>resolve(obj);tx.onerror=()=>reject(tx.error);});}
function del(store,id){return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function rows(store){return (await all(store)).sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""));}
async function save(store,data){const old=data.id?await get(store,data.id):null;const obj={...old,...data,id:data.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};await put(store,obj);return obj;}

async function uploadStudioFiles(e){e.preventDefault();const aptId=state.studioApartmentId,input=$("#studioUploadInput"),files=Array.from(input?.files||[]);if(!aptId||!files.length){toast("اختر الشقة وصورة واحدة على الأقل","error");return;}if(files.some(f=>!["image/jpeg","image/png","image/webp","image/gif","image/avif","image/bmp"].includes(f.type))){toast("الاستوديو يدعم JPG وPNG وWebP وGIF وAVIF وBMP فقط.","error");return;}if(files.some(f=>f.size>25*1024*1024)){toast("حجم إحدى الصور يتجاوز 25 ميجابايت؛ قلل حجمها ثم أعد المحاولة.","error");return;}const caption=$("#studioCaption").value.trim(),residentName=$("#studioResidentName").value.trim(),tags=$("#studioTags").value.trim(),status=$("#studioUploadStatus"),submit=e.currentTarget.querySelector('button[type="submit"]');submit.disabled=true;let saved=0;try{for(let i=0;i<files.length;i++){if(status)status.textContent=`جارٍ حفظ الصورة ${fmt(i+1)} من ${fmt(files.length)}…`;const file=files[i];let dataUrl=await fileToData(file);if(file.size>1800*1024&&file.type!=="image/gif"){try{dataUrl=await compressStudioImage(file);}catch(_){}}const outputMime=(dataUrl.match(/^data:([^;,]+)/)||[])[1]||file.type||"image/jpeg";await save("studioPhotos",{apartmentId:aptId,caption:caption||file.name.replace(/\.[^.]+$/,""),residentName,tags,originalName:file.name,mimeType:outputMime,size:file.size,dataUrl});saved++;}toast(`تم حفظ ${fmt(saved)} صورة`);state.search="";await render();}catch(err){toast(`تم حفظ ${fmt(saved)} من ${fmt(files.length)} صور. ${err.name==="QuotaExceededError"||/quota|storage/i.test(err.message)?"مساحة التخزين غير كافية؛ نزّل الصور أو أنشئ نسخة احتياطية ثم أفرغ مساحة.":err.message||"تعذر الحفظ"}`,"error");await render();}finally{const b=document.querySelector(`#studioUploadForm button[type="submit"]`);if(b)b.disabled=false;}}
function compressStudioImage(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{try{const scale=Math.min(1,2400/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext("2d");if(!ctx)throw new Error("Canvas unavailable");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.88));}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("تعذر قراءة الصورة"));};image.src=url;});}
async function viewStudioPhoto(id){const p=await get("studioPhotos",id);if(!p)return;const root=$("#modalRoot");root.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${esc(p.caption||p.originalName||"صورة ساكن")}</h3><p class="small-text">${esc(p.residentName||"")}</p></div><button class="close-btn" data-close>×</button></div><div class="modal-body"><img class="studio-preview" src="${studioImageSrc(p)}" alt="${esc(p.caption||"صورة ساكن")}"><p class="small-text">${esc(p.tags||"")}</p></div><div class="modal-foot"><button class="button" data-studio-download="${p.id}">تحميل الصورة</button><button class="button ghost" data-close>إغلاق</button></div></div></div>`;root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);root.querySelector("[data-studio-download]").onclick=()=>downloadStudioPhoto(p.id);root.querySelector(".modal-backdrop").addEventListener("click",e=>{if(e.target.classList.contains("modal-backdrop"))closeModal();});}
async function downloadStudioPhoto(id){const p=await get("studioPhotos",id);if(!p?.dataUrl||!/^data:image\/(?:jpeg|png|webp|gif|avif|bmp);base64,/i.test(p.dataUrl)){toast("الصورة غير موجودة أو بياناتها غير مكتملة","error");return;}const a=document.createElement("a");a.href=p.dataUrl;const stem=(p.originalName||("omran-photo-"+id)).replace(/\.[^.]+$/,"").replace(/[\\/:*?"<>|]/g,"_"),ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/avif":"avif","image/bmp":"bmp"})[p.mimeType]||"jpg";a.download=stem+"."+ext;document.body.append(a);a.click();a.remove();toast("تم طلب تحميل الصورة");}
async function editStudioPhoto(id){const p=await get("studioPhotos",id);if(!p)return;const caption=prompt("وصف الصورة",p.caption||"");if(caption===null)return;const residentName=prompt("اسم الساكن (اختياري)",p.residentName||"");if(residentName===null)return;const tags=prompt("الوسوم مفصولة بفواصل",p.tags||"");if(tags===null)return;await save("studioPhotos",{...p,caption:caption.trim(),residentName:residentName.trim(),tags:tags.trim()});toast("تم تحديث بيانات الصورة");await render();}
async function deleteStudioPhoto(id){const p=await get("studioPhotos",id);if(!p||!confirm("حذف الصورة «"+(p.caption||p.originalName||"بدون عنوان")+"» نهائيًا من هذا الجهاز؟"))return;await del("studioPhotos",id);toast("تم حذف الصورة");await render();}

async function remindersPage(){const [rs,bs,aps]=await Promise.all(["reminders","buildings","apartments"].map(all));const q=state.search.toLowerCase();const list=rs.filter(r=>(r.title+" "+r.type+" "+r.notes).toLowerCase().includes(q)).sort((a,b)=>(a.done-b.done)||(a.date||"").localeCompare(b.date||""));return `${sectionHead("التذكيرات والمهام","مواعيد العقود والصيانة والمدفوعات والمهام الدورية","تذكير جديد","add-reminders")}<div class="toolbar"><input class="search" placeholder="بحث في التذكيرات..." data-filter="search" value="${esc(state.search)}"><button class="button ghost" data-csv="reminders">تصدير CSV</button></div><div class="panel">${list.length?table(["الموعد","المهمة","النوع","الارتباط","الأولوية","الحالة","الإجراءات"],list.map(r=>`<tr><td>${dateFmt(r.date)} ${!r.done&&r.date<today()?pill("متأخر","bad"):!r.done&&r.date===today()?pill("اليوم","warn"):""}</td><td><b>${esc(r.title)}</b><small class="muted" style="display:block">${esc(r.notes||"")}</small></td><td>${esc(r.type||"عام")}</td><td>${esc(r.apartmentId?apartmentName(r.apartmentId,aps,bs):buildingName(r.buildingId,bs))}</td><td>${pill(r.priority||"عادي",r.priority==="عاجل"?"bad":"")}</td><td>${pill(r.done?"مكتمل":"مفتوح",r.done?"good":"warn")}</td><td><button data-action="toggle-reminder" data-id="${r.id}">${r.done?"إعادة فتح":"إنجاز"}</button> ${actionButtons("reminders",r.id)}</td></tr>`).join("")):empty("لا توجد تذكيرات","أضف مواعيد تنظيف الخزانات وتجديد العقود وسداد المستحقات.")}</div><div class="notice">التذكيرات تظهر داخل البرنامج عند فتحه. إشعارات النظام في الخلفية قد تحتاج إلى تثبيت PWA أو تطبيق أصلي، ولا يضمن ملف HTML وحده تشغيل تنبيهات موثوقة عند إغلاق المتصفح.</div>`;}
async function reportsPage(){const [bs,aps,rs,inv,ms,us,ts,rem]=await Promise.all(["buildings","apartments","residents","inventory","maintenance","utilities","transactions","reminders"].map(all));const inc=ts.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount||0),0),out=ts.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount||0),0),active=rs.filter(r=>!r.exitDate).length;return `${sectionHead("التقارير","ملخص تشغيلي ومالي قابل للتصدير والطباعة","طباعة التقرير","print")}<div class="report-summary">${[[ "العمارات",bs.length],[ "الشقق",aps.length],[ "السكان المقيمون",active],[ "أصناف المخزون",inv.length],[ "طلبات صيانة مفتوحة",ms.filter(m=>m.status!=="مكتمل").length],[ "عمليات المرافق",us.length],[ "إجمالي الإيرادات",money(inc)],[ "إجمالي المصروفات",money(out)],[ "صافي الحركة",money(inc-out)]].map(x=>`<div class="report-box"><small>${x[0]}</small><b>${fmt(x[1])}</b></div>`).join("")}</div><div class="panel">${panelHead("تقارير تفصيلية","نزّل الجداول لاستخدامها في Excel أو اطبع ملخصًا PDF")}<div class="quick-grid">${[["buildings","العمارات"],["apartments","الشقق"],["residents","السكان"],["inventory","العهد والمخزون"],["maintenance","الصيانة والتلفيات"],["utilities","المرافق"],["transactions","الحسابات المالية"],["reminders","التذكيرات"]].map(([k,v])=>`<button class="quick-tile" data-csv="${k}"><span>⇩</span><b>تصدير ${v} CSV</b></button>`).join("")}</div></div><div class="panel">${panelHead("متابعة التذكيرات","المهام المفتوحة")} ${rem.filter(r=>!r.done).length?table(["الموعد","المهمة","الأولوية"],rem.filter(r=>!r.done).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<tr><td>${dateFmt(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.priority||"عادي")}</td></tr>`).join("")):empty("كل المهام مكتملة","لا توجد تذكيرات مفتوحة.")}</div>`;}

async function settingsPage(){const pin=await get("meta","pin");return `${sectionHead("الإعدادات","إعدادات عملية، الخصوصية، وأذونات Android")}<div class="panel permission-panel">${panelHead("أذونات التطبيق على Android","تحكم في السماح أو المنع من إعدادات النظام نفسها")}<p>يفتح هذا الزر صفحة معلومات تطبيق ROWAD في Android؛ ومن هناك يمكنك مراجعة الأذونات التي يعلنها التطبيق وتغيير ما يسمح به النظام. لا يطلب التطبيق تلقائيًا صلاحيات لا يحتاجها.</p><div class="permission-list"><div><b>الصور والملفات</b><span>اختيار الملفات عبر منتقي Android؛ لا يحتاج عادةً إلى صلاحية تخزين شاملة.</span></div><div><b>الكاميرا</b><span>يمكن اختيار الصور من الكاميرا عبر منتقي النظام؛ لن تُفعّل صلاحية كاميرا مباشرة إلا عند إضافة ميزة تصوير أصلية.</span></div><div><b>الإشعارات</b><span>لا توجد إشعارات خلفية مفعّلة في هذه النسخة.</span></div><div><b>الموقع، جهات الاتصال، الميكروفون، الرسائل وسجل المكالمات</b><span>غير مستخدمة حاليًا؛ لن تُطلب لمجرد إضافتها إلى قائمة الأذونات.</span></div></div><button class="button" data-action="open-app-settings">⚙ فتح إعدادات أذونات Android</button><p class="small-text">إذا لم يفتح النظام من داخل نسخة HTML، ثبّت APK ROWAD؛ زر إعدادات النظام يعتمد على الجسر الأصلي داخل APK.</p></div><div class="two-col"><div class="panel">${panelHead("معلومات النظام","بيانات التطبيق الحالية")}<div class="bar-row" style="grid-template-columns:1fr auto"><span>إصدار التطبيق</span><b>1.0.0</b></div><div class="bar-row" style="grid-template-columns:1fr auto"><span>قاعدة البيانات</span><b>IndexedDB</b></div><div class="bar-row" style="grid-template-columns:1fr auto"><span>الاتصال بخادم خارجي</span><b>غير مستخدم</b></div><div class="bar-row" style="grid-template-columns:1fr auto"><span>قفل التطبيق</span><b>${pin?.value?"مفعّل":"غير مفعّل"}</b></div><p class="small-text">كل بيانات السجلات الأساسية تحفظ في متصفح هذا الجهاز. مسح بيانات المتصفح قد يحذفها؛ استخدم النسخ الاحتياطي بانتظام.</p></div><div class="panel">${panelHead("قفل عرض التطبيق","قفل بسيط لمنع فتح الواجهة دون الرمز")}<form id="pinForm" class="form-grid"><div class="form-field full"><label>رمز دخول جديد (4 أرقام أو أكثر)</label><input class="field" id="pinValue" type="password" inputmode="numeric" minlength="4" placeholder="اتركه فارغًا لإزالة القفل"></div><div class="form-field full"><label>تأكيد الرمز</label><input class="field" id="pinConfirm" type="password" inputmode="numeric" minlength="4"></div><div class="form-field full"><button class="button" type="submit">حفظ إعداد القفل</button></div></form><p class="notice">هذا القفل لا يشفر قاعدة البيانات المحلية، ولا يحميها من شخص يستطيع الوصول إلى ملفات المتصفح أو أدوات المطور. لا تعتبره بديلًا عن قفل الجهاز.</p></div></div><div class="panel danger-zone">${panelHead("منطقة البيانات الحساسة","احذر قبل تنفيذ أي إجراء حذف")}<h4>حذف جميع البيانات المحلية</h4><p>سيتم حذف العمارات والشقق والسكان وصور الاستوديو والمرفقات والعهد والسجلات المالية والتذكيرات من قاعدة بيانات هذا المتصفح. لا يمكن التراجع عن ذلك دون نسخة احتياطية.</p><button class="button danger" data-action="clear-all">حذف كل البيانات</button></div>`;}
function field(name,label,type="text",value="",opts={}){const full=opts.full?" full":"";let input;if(type==="select")input=`<select class="field" name="${name}" ${opts.required?"required":""}>${opts.options||""}</select>`;else if(type==="textarea")input=`<textarea class="field" name="${name}" ${opts.required?"required":""} placeholder="${opts.placeholder||""}">${esc(value)}</textarea>`;else if(type==="file")input=`<input class="field" name="${name}" type="file" accept="${opts.accept||"image/*,.pdf"}">`;else input=`<input class="field" name="${name}" type="${type}" value="${esc(value)}" ${opts.required?"required":""} ${opts.min!==undefined?`min="${opts.min}"`:""} ${opts.step?`step="${opts.step}"`:""} placeholder="${opts.placeholder||""}">`;return `<div class="form-field${full}"><label>${label}${opts.required?" *":""}</label>${input}${opts.help?`<small>${opts.help}</small>`:""}</div>`;}
function selectOptions(items,selected,labelFn){return items.map(x=>`<option value="${x.id}" ${selected===x.id?"selected":""}>${esc(labelFn(x))}</option>`).join("");}

async function exportBackup(encrypted=false){const data={app:"omran-property-manager",version:1,exportedAt:new Date().toISOString(),stores:{}};for(const s of stores)data.stores[s]=await all(s);let out=JSON.stringify(data);let name=`omran-backup-${today()}.json`;if(encrypted){const password=prompt("اختر كلمة مرور قوية لتشفير النسخة. لن يمكن استعادتها دون كلمة المرور.");if(!password)return;if(password.length<8){toast("استخدم كلمة مرور من 8 أحرف على الأقل","error");return;}try{out=await encryptText(out,password);name=`omran-backup-${today()}.omran`;}catch(e){toast("تعذر تشفير النسخة في هذا المتصفح","error");return;}}downloadBlob(out,name,encrypted?"application/octet-stream":"application/json");toast(encrypted?"تم إنشاء نسخة مشفرة":"تم إنشاء النسخة الاحتياطية");}
async function encryptText(text,password){if(!crypto?.subtle)throw new Error("WebCrypto unavailable");const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt"]);const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(text));return JSON.stringify({format:"OMRAN-ENC-1",salt:b64(salt),iv:b64(iv),cipher:b64(new Uint8Array(cipher))});}
async function decryptText(obj,password){const enc=new TextEncoder(),dec=new TextDecoder(),salt=unb64(obj.salt),iv=unb64(obj.iv),cipher=unb64(obj.cipher);const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,cipher));}
function b64(a){return btoa(String.fromCharCode(...a));}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function importBackup(){const file=$("#importFile").files[0];if(!file){toast("اختر ملف النسخة أولًا","error");return;}if(file.size>300*1024*1024){toast("حجم الملف يتجاوز الحد المسموح (300MB). نزّل الصور منفصلة أو أنشئ نسخًا أصغر.","error");return;}try{let text=await file.text(),obj=JSON.parse(text);if(obj.format==="OMRAN-ENC-1"){const pw=prompt("أدخل كلمة مرور النسخة الاحتياطية:");if(!pw)return;text=await decryptText(obj,pw);obj=JSON.parse(text);}if(obj.app!=="omran-property-manager"||!obj.stores||!Array.isArray(obj.stores.buildings)||!Array.isArray(obj.stores.apartments))throw new Error("ملف النسخة غير صالح أو لا يتبع عُمران");const merge=$("#mergeImport").checked;if(!merge&&!confirm("سيتم استبدال البيانات الحالية بالنسخة المختارة. هل أنشأت نسخة احتياطية من البيانات الحالية؟"))return;const valid=stores.filter(s=>Array.isArray(obj.stores[s]));const missingStores=stores.filter(s=>!Array.isArray(obj.stores[s]));if(!merge){for(const s of valid)await new Promise((resolve,reject)=>{const tx=db.transaction(s,"readwrite");tx.objectStore(s).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}for(const s of valid){for(const record of obj.stores[s]){if(record&&record.id)await put(s,record);}}toast(`تم استيراد ${fmt(valid.reduce((n,s)=>n+obj.stores[s].length,0))} سجلًا`);if(missingStores.length)toast("النسخة أقدم من بعض أقسام التطبيق؛ تم الاحتفاظ ببيانات الأقسام غير الموجودة في النسخة لتجنب فقدانها.");state.page="dashboard";await render();}catch(e){toast(e.message.includes("OperationError")?"كلمة المرور غير صحيحة أو الملف تالف":`فشل الاستيراد: ${e.message}`,"error");}}
async function clearAll(){if(!confirm("تحذير: سيتم حذف جميع البيانات نهائيًا من هذا المتصفح. هل أنت متأكد؟"))return;if(!confirm("تأكيد أخير: هل أنشأت نسخة احتياطية وتريد حذف كل السجلات؟"))return;for(const s of stores)await new Promise((resolve,reject)=>{const tx=db.transaction(s,"readwrite");tx.objectStore(s).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});toast("تم حذف جميع البيانات المحلية");state.page="dashboard";render();}
async function setupPin(){const pin=await get("meta","pin");if(!pin?.value)return;const value=prompt("أدخل رمز الدخول لفتح عُمران");if(value===null||value!==pin.value){document.body.innerHTML='<main style="padding:40px;text-align:center;font-family:Arial"><h2>التطبيق مقفل</h2><p>أعد تحميل الصفحة وحاول مرة أخرى.</p></main>';state.lock=true;return;}}
async function init(){if(!("indexedDB" in window)){alert("هذا المتصفح لا يدعم IndexedDB.");return;}try{db=await openDB();await setupPin();if(state.lock)return;$("#sidebar").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)navigate(b.dataset.page);});$("#menuToggle").onclick=()=>$("#sidebar").classList.toggle("open");$("#quickAdd").onclick=()=>openQuickAdd();$("#profileBtn").onclick=()=>navigate("settings");$("#pageContent").addEventListener("change",e=>{if(e.target.id==="financeMonth"){state.financeMonth=e.target.value;render();}});$("#pageContent").addEventListener("click",e=>{if(e.target.id==="financeMonth")return;});$("#pageContent").addEventListener("submit",e=>{if(e.target.id==="pinForm")e.preventDefault();});document.addEventListener("click",e=>{if(e.target.id==="importBtn")importBackup();});document.addEventListener("submit",async e=>{if(e.target.id==="pinForm"){e.preventDefault();const a=$("#pinValue").value,b=$("#pinConfirm").value;if(a&&a.length<4){toast("الرمز يجب ألا يقل عن 4 أرقام","error");return;}if(a!==b){toast("الرمزان غير متطابقين","error");return;}if(a&&!/^\d{4,}$/.test(a)){toast("استخدم 4 أرقام أو أكثر","error");return;}if(a)await put("meta",{id:"pin",value:a});else await del("meta","pin");toast("تم تحديث إعداد القفل");render();}});await render();}catch(e){console.error(e);toast("تعذر فتح قاعدة البيانات المحلية: "+e.message,"error");}}
async function openQuickAdd(){const opts=[["buildings","عمارة"],["apartments","شقة"],["residents","ساكن"],["inventory","صنف عهدة"],["maintenance","طلب صيانة"],["utilities","عملية مرافق"],["transactions","حركة مالية"],["reminders","تذكير"]];const root=$("#modalRoot");root.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog"><div class="modal-head"><h3>إضافة جديدة</h3><button class="close-btn" data-close>×</button></div><div class="modal-body"><div class="quick-grid">${opts.map(([k,v])=>`<button class="quick-tile" data-qadd="${k}"><span>＋</span><b>${v}</b></button>`).join("")}</div></div></div></div>`;root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);root.querySelectorAll("[data-qadd]").forEach(b=>b.onclick=()=>{const k=b.dataset.qadd;closeModal();openForm(k);});}
init();
})();
</script>
