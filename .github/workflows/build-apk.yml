name: Build Omran Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - phase-2-omran-native-apk
      - phase-3-apartment-photo-studio

permissions:
  contents: read

concurrency:
  group: omran-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source exists
        shell: bash
        run: |
          test -s index.html
          test -s عماره6.html
          echo "Standalone Arabic application source found."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript was found in index.html")
          Path("/tmp/omran-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/omran-inline.js

      - name: Check required app features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          arabic_copy = Path("عماره6.html").read_text(encoding="utf-8")
          checks = {
              "ROWAD branding": "ROWAD - عماره" in s and "<title>ROWAD - عماره" in s,
              "Android permissions settings UI": "openAndroidAppSettings" in s and "permission-list" in s,
              "human-centered warm theme": "--terracotta:#a85e48" in s and "human-centered UX" in s,
              "accessible motion system": "Refined motion system" in s and "prefers-reduced-motion:reduce" in s and "page-enter" in s,
              "IndexedDB schema upgrade": "DB_VERSION=4" in s,
              "studio photo store": '"studioPhotos"' in s,
              "studio page and upload": "async function studioPage" in s and "async function uploadStudioFiles" in s,
              "studio download and delete": "async function downloadStudioPhoto" in s and "async function deleteStudioPhoto" in s,
              "apartment studio option": "openStudioAfterSave" in s and 'data-action="studio-open"' in s,
              "legacy backup compatibility": "const missingStores=stores.filter" in s,
              "blocked database upgrade handling": "req.onblocked" in s,
              "database startup timeout": "انتهت مهلة فتح قاعدة البيانات" in s,
              "version-change connection handling": "d.onversionchange" in s,
              "standalone sources stay synchronized": s == arabic_copy,
              "residence history store": '"residenceHistory"' in s,
              "resident transfer action": 'data-action="transfer-resident"' in s,
              "resident departure action": 'data-action="exit-resident"' in s,
              "historical movement persistence": 'await save("residenceHistory"' in s,
              "full backup export": "async function exportBackup" in s,
              "backup restore": "async function importBackup" in s,
              "rent workflow": "openRentForm" in s,
              "maintenance module": "maintenance" in s,
              "inventory module": "stockMoves" in s,
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Missing required features: " + ", ".join(failed))
          PY
          python3 tests/source-smoke.py
          node tests/database-open-tests.js
          node tests/database-open-tests.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Prepare web assets
        shell: bash
        run: |
          mkdir -p build/www
          cp index.html build/www/index.html
          cp عماره6.html build/www/عماره6.html
          test -s build/www/index.html

      - name: Install Capacitor and initialize Android project
        working-directory: build
        shell: bash
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@6 @capacitor/android@6
          npm install --save-dev --save-exact @capacitor/cli@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.omran.buildingmanager",
            "appName": "ROWAD - عماره",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Add native Android app-settings bridge
        working-directory: build/android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/omran/buildingmanager
          cat > app/src/main/java/com/omran/buildingmanager/AppSettingsPlugin.java <<'JAVA'
          package com.omran.buildingmanager;

          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppSettings")
          public class AppSettingsPlugin extends Plugin {
              @PluginMethod
              public void open(PluginCall call) {
                  try {
                      Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(Uri.fromParts("package", getContext().getPackageName(), null));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      JSObject result = new JSObject();
                      result.put("opened", true);
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Unable to open Android app settings", error);
                  }
              }
          }
          JAVA
          cat > app/src/main/java/com/omran/buildingmanager/MainActivity.java <<'JAVA'
          package com.omran.buildingmanager;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppSettingsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Build debug APK
        working-directory: build/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and name APK artifact
        shell: bash
        run: |
          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="build/android/app/build/outputs/apk/debug/ROWAD-Omara-debug.apk"
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          file "$OUT"
          sha256sum "$OUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: omran-android-debug-apk
          path: build/android/app/build/outputs/apk/debug/ROWAD-Omara-debug.apk
          if-no-files-found: error
          retention-days: 30
